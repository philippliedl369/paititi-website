<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="any">
<script src="/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="/_ds/meristem-design-system/tokens/fonts.css">
<link rel="stylesheet" href="/_ds/meristem-design-system/tokens/colors.css">
<link rel="stylesheet" href="/_ds/meristem-design-system/tokens/typography.css">
<link rel="stylesheet" href="/_ds/meristem-design-system/tokens/spacing.css">
<link rel="stylesheet" href="/_ds/meristem-design-system/tokens/effects.css">
<link rel="stylesheet" href="/_ds/meristem-design-system/styles.css">
<script src="/_ds/meristem-design-system/_ds_bundle.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  #pt-nav-links{display:flex;align-items:center;gap:22px}
  #pt-menu-btn{display:none}
  @media (max-width:1080px){
    #pt-nav-links{display:none}
    #pt-menu-btn{display:inline-flex}
  }
  .pt-dropdown{position:relative}
  .pt-dropdown-panel{position:absolute;top:calc(100% + 10px);left:-16px;min-width:220px;background:#fff;border:1px solid var(--border-subtle);border-radius:var(--radius-md);box-shadow:0 12px 32px rgba(33,4,22,0.14);padding:8px;display:none;z-index:60}
  .pt-dropdown:hover .pt-dropdown-panel,.pt-dropdown:focus-within .pt-dropdown-panel{display:block}
  .pt-dropdown-panel a{display:block;padding:10px 14px;border-radius:var(--radius-sm);font-weight:600;font-size:15px;color:var(--text-heading);text-decoration:none}
  .pt-dropdown-panel a:hover{background:var(--surface-section);color:var(--accent-primary)}
  a button[style*="inline-flex"]{max-width:100%;box-sizing:border-box}
</style>
</helmet>
<a href="https://www.zeffy.com/en-US/donation-form/paititi-institute-ancestral-campus-for-yahua-tribe-children-in-the-amazon-rainforest" target="_blank" rel="noopener" style="display:block;background:var(--surface-inverse);color:#fff;text-decoration:none;text-align:center;padding:10px 16px;font-family:var(--font-body);font-size:14px;font-weight:600">🌿 Support the Growth of the Yahua Ancestral School and Living Wisdom Center</a>
<header style="background:rgba(255,255,255,0.94);backdrop-filter:saturate(1.1) blur(8px);border-bottom:1px solid var(--border-subtle);font-family:var(--font-body)">
  <div style="max-width:var(--container-wide);margin:0 auto;padding:0 24px;height:76px;display:flex;align-items:center;justify-content:space-between;gap:24px">
    <a href="/" style="display:inline-flex;align-items:center;text-decoration:none" aria-label="Paititi Institute — home">
      <img src="/assets/brand/paititi-logo-purple.png" alt="Paititi Institute" width="525" height="245" style="height:54px;width:auto;display:block">
    </a>
    <nav id="pt-nav-links" aria-label="Main">
      <div class="pt-dropdown">
        <button style="display:inline-flex;align-items:center;gap:4px;background:none;border:none;cursor:pointer;font-family:var(--font-body);font-weight:600;font-size:15px;color:var(--text-heading);padding:4px 2px">The Institute
          <x-import component-from-global-scope="MeristemDS.Icon" name="ChevronDown" size="16" hint-size="16px,16px"></x-import>
        </button>
        <div class="pt-dropdown-panel">
          <a href="/initiatives">Initiatives</a>
          <a href="/about-us">About Us</a>
          <a href="/team">Team</a>
          <a href="/beyond-ayahuasca">Beyond Ayahuasca</a>
        </div>
      </div>
      <sc-for list="{{ links }}" as="link" hint-placeholder-count="4">
        <a href="{{ link.href }}" style="font-weight:600;font-size:15px;color:var(--text-heading);text-decoration:none;padding:4px 2px;box-shadow:{{ link.underline }}">{{ link.label }}</a>
      </sc-for>
      <a href="/donate" style="text-decoration:none">
        <x-import component-from-global-scope="MeristemDS.Button" variant="primary" size="sm" hint-size="100px,36px">Donate</x-import>
      </a>
      <a href="/cart" aria-label="Cart" style="display:inline-flex;align-items:center;gap:6px;color:var(--text-heading);text-decoration:none;font-weight:600;font-size:14px">
        <x-import component-from-global-scope="MeristemDS.Icon" name="ShoppingBag" size="20" hint-size="20px,20px"></x-import>
        <span id="pt-cart-count" style="min-width:14px">{{ cartCount }}</span>
      </a>
    </nav>
    <button id="pt-menu-btn" onClick="{{ toggleMenu }}" aria-label="Menu" style="width:44px;height:44px;align-items:center;justify-content:center;background:transparent;border:1px solid var(--border-subtle);border-radius:var(--radius-md);color:var(--text-heading);cursor:pointer">
      <x-import component-from-global-scope="MeristemDS.Icon" name="{{ menuIcon }}" size="22" hint-size="22px,22px"></x-import>
    </button>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div style="border-top:1px solid var(--border-subtle);background:#fff;padding:8px 24px 20px">
      <nav aria-label="Mobile" style="display:grid;gap:2px">
        <sc-for list="{{ mobileLinks }}" as="link" hint-placeholder-count="9">
          <a href="{{ link.href }}" style="font-weight:600;font-size:16px;color:var(--text-heading);text-decoration:none;padding:12px 0;border-bottom:1px solid var(--border-subtle)">{{ link.label }}</a>
        </sc-for>
        <a href="/donate" style="text-decoration:none;margin-top:14px;display:block">
          <x-import component-from-global-scope="MeristemDS.Button" variant="primary" size="md" style="width:100%" hint-size="100%,42px">Donate</x-import>
        </a>
      </nav>
    </div>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:220},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;institute&quot;,&quot;retreats&quot;,&quot;courses&quot;,&quot;blog&quot;,&quot;store&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { open: false, cartCount: 0 };
  componentDidMount() {
    try {
      const cart = JSON.parse(localStorage.getItem('pt-cart') || '[]');
      const n = cart.reduce((s, i) => s + (i.qty || 1), 0);
      if (n !== this.state.cartCount) this.setState({ cartCount: n });
      window.addEventListener('pt-cart-changed', (e) => this.setState({ cartCount: e.detail.count }));
    } catch (err) { /* localStorage unavailable */ }
  }
  renderVals() {
    const active = this.props.active ?? '';
    const links = [
      ['Events & Retreats', '/retreats', 'retreats'],
      ['Online Courses', '/online-courses', 'courses'],
      ['Distance Healing', 'https://www.paititidistancehealing.com', 'healing'],
      ['Blog', '/blog', 'blog'],
    ].map(([label, href, key]) => ({
      label, href,
      underline: key === active ? 'inset 0 -2px 0 var(--accent-highlight)' : 'none',
    }));
    const mobileLinks = [
      ['Initiatives', '/initiatives'],
      ['About Us', '/about-us'],
      ['Team', '/team'],
      ['Beyond Ayahuasca', '/beyond-ayahuasca'],
      ['Events & Retreats', '/retreats'],
      ['Online Courses', '/online-courses'],
      ['Distance Healing', 'https://www.paititidistancehealing.com'],
      ['Blog', '/blog'],
      ['Cart', '/cart'],
    ].map(([label, href]) => ({ label, href }));
    return {
      links, mobileLinks,
      cartCount: this.state.cartCount ? String(this.state.cartCount) : '',
      menuOpen: this.state.open,
      toggleMenu: () => this.setState(s => ({ open: !s.open })),
      menuIcon: this.state.open ? 'X' : 'Menu',
    };
  }
}
</script>
</body>
</html>
