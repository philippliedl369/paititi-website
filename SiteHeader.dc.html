<!DOCTYPE html>

<head>

<script src="/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="/_ds/meristem-design-system/tokens/fonts.css">
<link rel="stylesheet" href="/_ds/meristem-design-system/tokens/colors.css">
<link rel="stylesheet" href="/_ds/meristem-design-system/tokens/typography.css">
<link rel="stylesheet" href="/_ds/meristem-design-system/tokens/spacing.css">
<link rel="stylesheet" href="/_ds/meristem-design-system/tokens/effects.css">
<link rel="stylesheet" href="/_ds/meristem-design-system/styles.css">
<script src="/_ds/meristem-design-system/_ds_bundle.js"></script>
<style>
  /* The header floats over the first section of every page — on the original,
     every page's first section is either a full-bleed photo or the plum band,
     so white chrome always has something dark underneath. Pages reserve the
     space with padding-top:var(--pt-header-h) on that first section. */
  :root{--pt-header-h:209px;--pt-announce-h:49px}
  .pt-header,.pt-header *,.pt-header *::before,.pt-header *::after{box-sizing:border-box}
  .pt-header{position:fixed;top:0;left:0;right:0;z-index:50;font-family:var(--font-body);
    letter-spacing:.08em;transition:transform .3s cubic-bezier(.4,0,.2,1)}
  .pt-header[data-hidden="1"]{transform:translateY(-100%)}
  .pt-announce{background:#0B0009;color:#fff;position:relative;
    display:flex;align-items:center;justify-content:center;min-height:var(--pt-announce-h);padding:0 48px}
  .pt-announce a.pt-announce-link{color:#fff;text-decoration:none;font-size:14px;font-weight:300;
    line-height:1.35;text-align:center;padding:7px 0}
  .pt-announce a.pt-announce-link:hover{text-decoration:underline;color:#fff}
  .pt-announce-x{position:absolute;right:14px;top:50%;transform:translateY(-50%);
    background:none;border:0;color:rgba(255,255,255,.72);font-size:19px;line-height:1;cursor:pointer;padding:6px 8px}
  .pt-announce-x:hover{color:#fff}

  .pt-bar{display:flex;align-items:center;gap:24px;padding:0 58px;height:160px}
  .pt-logo img{height:146px;width:auto;display:block}

  /* No max-width: the original keeps all five items on one row and only breaks
     to a second when the bar actually runs out of room (one row at >=1680px,
     two at <=1440). Letting flex decide reproduces that at every width. */
  /* flex:1 1 auto — the nav absorbs the bar's free space itself, so it stays on
     one row until its content genuinely exceeds the gap between logo and socials.
     (With margin-left:auto on .pt-social instead, the socials ate the free space
     and the nav wrapped at every width.) */
  .pt-nav{display:flex;flex-wrap:wrap;align-items:center;column-gap:24px;row-gap:0;flex:1 1 auto;min-width:0}
  /* .pt-folder is a wrapper div, so its <a> needs the link styling too — without
     it "The Institute" falls back to the design system's default anchor colour. */
  .pt-nav > *,.pt-folder > a{font-size:16px;font-weight:700;color:#fff;text-decoration:none;white-space:nowrap;
    background:none;border:0;padding:0;font-family:var(--font-body);cursor:pointer;line-height:32px}
  .pt-nav > *:hover,.pt-folder > a:hover{opacity:.78;color:#fff}
  .pt-nav [data-active="1"]{box-shadow:inset 0 -2px 0 #fff}

  .pt-folder{position:relative}
  /* Translucent plum card, white bold items — matches the live flyout. */
  .pt-folder-panel{position:absolute;top:calc(100% + 13px);left:-22px;min-width:330px;
    background:rgba(88,67,100,.94);box-shadow:0 14px 38px rgba(11,0,9,.28);padding:16px 22px;z-index:60;
    /* Kept in flow but invisible rather than display:none, so leaving the menu
       fades out over .28s instead of snapping shut the instant the pointer
       slips off an item. */
    opacity:0;visibility:hidden;transition:opacity .16s ease,visibility 0s linear .28s}
  /* The 13px offset above is a dead zone the pointer has to cross on its way
     down from "The Institute"; this invisible strip keeps :hover alive over it. */
  .pt-folder-panel::before{content:"";position:absolute;left:0;right:0;top:-13px;height:13px}
  .pt-folder:hover .pt-folder-panel,.pt-folder:focus-within .pt-folder-panel{
    opacity:1;visibility:visible;transition:opacity .16s ease,visibility 0s}
  .pt-folder-panel a{display:block;padding:2px 0;font-size:16px;font-weight:700;color:#fff;
    text-decoration:none;line-height:30px;white-space:nowrap}
  .pt-folder-panel a:hover{color:#fff;opacity:.78}

  /* Scoped to .pt-header: SiteFooter also defines .pt-social, and both
     components' helmet styles land in the same <head>, so an unscoped rule
     there would win on source order and re-show these icons on mobile. */
  .pt-header .pt-social{display:flex;align-items:center;gap:25px;flex:0 0 auto}
  .pt-header .pt-social a{color:#fff;display:inline-flex;opacity:.92}
  .pt-header .pt-social a:hover{opacity:1}

  .pt-donate{display:inline-flex;align-items:center;justify-content:center;height:59px;padding:0 21px;
    background:#fff;color:#584364;border-radius:16px 0;font-size:19px;font-weight:700;letter-spacing:.02em;
    text-decoration:none;white-space:nowrap}
  .pt-donate:hover{background:#F1EAF6;color:#584364}

  .pt-burger{display:none;margin-left:auto;width:46px;height:46px;align-items:center;justify-content:center;
    background:none;border:1px solid rgba(255,255,255,.45);border-radius:16px 0;color:#fff;cursor:pointer}
  .pt-mobile{background:#0B0009;padding:8px 24px 26px}
  .pt-mobile a{display:block;color:#fff;text-decoration:none;font-size:17px;font-weight:700;
    padding:14px 0;border-bottom:1px solid rgba(255,255,255,.14)}
  /* Out-specifies .pt-mobile a, which would otherwise paint this white on white. */
  .pt-mobile a.pt-donate{display:inline-flex;color:#584364;margin-top:20px;padding:0 21px;border-bottom:0}

  @media (max-width:1180px){
    .pt-bar{gap:20px;padding:0 28px;height:120px}
    .pt-logo img{height:104px}
    .pt-nav{column-gap:22px}
    .pt-nav > *{font-size:15px}
    .pt-header .pt-social{gap:16px}
  }
  @media (max-width:1080px){
    :root{--pt-header-h:150px}
    .pt-nav,.pt-header .pt-social,.pt-donate{display:none}
    .pt-burger{display:inline-flex}
    .pt-bar{height:100px;padding:0 22px}
    .pt-logo img{height:78px}
  }
</style>
</helmet>

    <a class="pt-donate" href="/initiatives/yagua-cultural-heritage-center-indigenous-school">Donate</a>

    <!-- Inline SVG, like the social marks above: this component no longer pulls
         in Lucide, and MeristemDS.Icon rendered an empty <svg> without it. -->
    <button class="pt-burger" onClick="{{ toggleMenu }}" aria-label="Menu" aria-expanded="{{ menuExpanded }}">
      <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
      </sc-if>
      <sc-if value="{{ menuClosed }}" hint-placeholder-val="{{ true }}">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:230},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;institute&quot;,&quot;retreats&quot;,&quot;courses&quot;,&quot;healing&quot;,&quot;blog&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { open: false, announceOpen: true, hidden: false };

  componentDidMount() {
    try {
      if (localStorage.getItem('pt-announce-dismissed') === '1') this.setState({ announceOpen: false });
    } catch (err) { /* localStorage unavailable */ }

    // The original header is fixed and retracts while you scroll down, returning
    // the moment you scroll back up. Small movements are ignored so the bar
    // doesn't flicker, and it always shows again near the top of the page.
    let last = window.scrollY;
    window.addEventListener('scroll', () => {
      const y = window.scrollY;
      if (Math.abs(y - last) < 8) return;
      const hide = y > last && y > 240 && !this.state.open;
      if (hide !== this.state.hidden) this.setState({ hidden: hide });
      last = y;
    }, { passive: true });
  }

  renderVals() {
    const active = this.props.active ?? '';
    const links = [
      ['Events & Retreats', '/retreats', 'retreats'],
      ['Online Courses', '/online-courses', 'courses'],
      ['Distance Healing', '/distance-healing', 'healing'],
      ['Blog', '/blog', 'blog'],
    ].map(([label, href, key]) => ({ label, href, active: key === active ? '1' : '0' }));

    const mobileLinks = [
      ['Initiatives', '/initiatives'],
      ['About Us', '/about-us'],
      ['Team', '/team'],
      ['Beyond Ayahuasca', '/beyond-ayahuasca'],
      ['Events & Retreats', '/retreats'],
      ['Online Courses', '/online-courses'],
      ['Distance Healing', '/distance-healing'],
      ['Blog', '/blog'],
    ].map(([label, href]) => ({ label, href }));

    return {
      links, mobileLinks,
      activeInstitute: active === 'institute' ? '1' : '0',
      announceOpen: this.state.announceOpen,
      hidden: this.state.hidden ? '1' : '0',
      menuOpen: this.state.open,
      menuClosed: !this.state.open,
      menuExpanded: this.state.open ? 'true' : 'false',
      toggleMenu: () => this.setState(s => ({ open: !s.open })),
      closeAnnounce: () => {
        this.setState({ announceOpen: false });
        try { localStorage.setItem('pt-announce-dismissed', '1'); } catch (err) { /* ignore */ }
      },
    };
  }
}
</script>
</body>
</html>
