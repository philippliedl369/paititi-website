<script>
  // JotForm posts "setHeight:<px>:<frame id>" from inside the iframe. Origin-
  // checked, because any framed page can post to this window.
  window.addEventListener('message', function (e) {
    var host;
    try { host = new URL(e.origin).hostname; } catch (err) { return; }
    if (!/(^|\.)jotform(pro)?\.com$/.test(host)) return;
    var args = String(e.data).split(':');
    if (args[0] !== 'setHeight') return;
    var px = parseInt(args[1], 10);
    var frame = document.getElementById('dh-contribution-form');
    if (frame && px > 0) frame.style.height = px + 'px';
  });
</script>
