<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="any">
<script src="/support.js"></script>
<script src="/cart.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Cart | Paititi Institute</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2A1736">
<link rel="icon" href="/assets/brand/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="/_ds/meristem-design-system/tokens/fonts.css">
<link rel="stylesheet" href="/_ds/meristem-design-system/tokens/colors.css">
<link rel="stylesheet" href="/_ds/meristem-design-system/tokens/typography.css">
<link rel="stylesheet" href="/_ds/meristem-design-system/tokens/spacing.css">
<link rel="stylesheet" href="/_ds/meristem-design-system/tokens/effects.css">
<link rel="stylesheet" href="/_ds/meristem-design-system/styles.css">
<script src="/_ds/meristem-design-system/_ds_bundle.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>body{margin:0;background:var(--surface-page)} a{color:var(--accent-primary)}</style>
</helmet>
<div style="font-family:var(--font-body);color:var(--text-body);background:var(--surface-page)">
<dc-import name="SiteHeader" active="store" style="display:block;height:var(--pt-header-h,209px)" hint-size="100%,209px"></dc-import>
<main>
  <section style="background:var(--surface-page);min-height:50vh">
    <div style="max-width:var(--container);margin:0 auto;padding:64px 24px var(--section-y)">
      <h1 class="ink-rule" style="font:var(--text-h1);color:var(--text-heading);margin:0 0 40px">Your cart</h1>
      <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
        <p style="font-size:17px;color:var(--text-muted)">Your cart is empty. <a href="/store">Visit the store</a> or <a href="/initiatives/project-one-f5w4d-4nex6">make a donation</a>.</p>
      </sc-if>
      <sc-if value="{{ notEmpty }}" hint-placeholder-val="{{ true }}">
        <div style="display:grid;gap:16px;margin-bottom:32px">
          <sc-for list="{{ items }}" as="item" hint-placeholder-count="1">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:18px 20px;flex-wrap:wrap">
              <div>
                <p style="font-weight:700;color:var(--text-heading);margin:0 0 4px">{{ item.name }}</p>
                <p style="font-size:14px;color:var(--text-muted);margin:0">{{ item.detail }}</p>
              </div>
              <div style="display:flex;align-items:center;gap:16px">
                <span style="font-weight:700;color:var(--text-heading)">{{ item.lineTotal }}</span>
                <button onClick="{{ item.remove }}" aria-label="Remove" style="background:none;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:6px 10px;cursor:pointer;color:var(--text-muted);font-family:var(--font-body)">Remove</button>
              </div>
            </div>
          </sc-for>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
          <p style="font-size:19px;font-weight:700;color:var(--text-heading);margin:0">Total: {{ total }}</p>
          <div onClick="{{ checkout }}"><x-import component-from-global-scope="MeristemDS.Button" variant="primary" size="lg" hint-size="200px,48px">Checkout</x-import></div>
        </div>
        <sc-if value="{{ error }}" hint-placeholder-val="{{ false }}">
          <p style="font-size:14px;color:#A33;margin:16px 0 0">{{ errorMsg }}</p>
        </sc-if>
      </sc-if>
    </div>
  </section>
</main>
<dc-import name="SiteFooter" hint-size="100%,700px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:1100}}">
class Component extends DCLogic {
  state = { items: [], error: '' };
  componentDidMount() {
    this.setState({ items: window.PtCart.get() });
    window.addEventListener('pt-cart-changed', (e) => this.setState({ items: e.detail.items }));
  }
  renderVals() {
    const fmt = (c) => '$' + (c / 100).toFixed(2);
    const items = this.state.items.map((i) => ({
      name: i.name,
      detail: (i.frequency && i.frequency !== 'one_time' ? i.frequency + ' · ' : '') + 'Qty ' + (i.qty || 1),
      lineTotal: fmt((i.amount ? i.amount * 100 : i.priceCents) * (i.qty || 1)),
      remove: () => window.PtCart.remove(i.id),
    }));
    const total = this.state.items.reduce((s, i) => s + (i.amount ? i.amount * 100 : i.priceCents) * (i.qty || 1), 0);
    return {
      items,
      empty: items.length === 0,
      notEmpty: items.length > 0,
      total: fmt(total),
      error: !!this.state.error,
      errorMsg: this.state.error,
      checkout: async () => {
        try { await window.PtCart.checkout(); }
        catch (e) { this.setState({ error: e.message }); }
      },
    };
  }
}
</script>
</body>
</html>
