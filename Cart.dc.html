<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="any">
<script src="/support.js"></script>
<script src="/cart.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Paititi Institute</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2A1736">
<link rel="icon" href="/assets/brand/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="/_ds/meristem-design-system/tokens/fonts.css">
<link rel="stylesheet" href="/_ds/meristem-design-system/tokens/colors.css">
<link rel="stylesheet" href="/_ds/meristem-design-system/tokens/typography.css">
<link rel="stylesheet" href="/_ds/meristem-design-system/tokens/spacing.css">
<link rel="stylesheet" href="/_ds/meristem-design-system/tokens/effects.css">
<link rel="stylesheet" href="/_ds/meristem-design-system/styles.css">
<link rel="stylesheet" href="/paititi.css">
<link rel="stylesheet" href="/store.css">
<script src="/_ds/meristem-design-system/_ds_bundle.js"></script>
</helmet>
<div class="pt-page sy-shell">
<dc-import name="SiteHeader" active="store" hint-size="100%,209px"></dc-import>
<main>

  <!-- A Squarespace system page: no section, no background colour of its own,
       the header height carried as padding and a 1200px column inside a
       62.4px page margin. The live cart is empty, so the empty state is the
       one that could be measured; the line items follow the same idiom. -->
  <div class="sy-page">
    <div class="sy-body">

      <div class="sy-title-row"><h2 class="sy-title">Shopping Cart</h2></div>

      <sc-if value="{{ empty }}" hint-placeholder-val="{{ true }}">
        <div class="sy-msg-row">
          <p class="sy-msg">You have nothing in your shopping cart.</p>
        </div>
        <a class="pt-sqs-btn pt-sqs-btn-sec" href="/">Continue Shopping</a>
      </sc-if>

      <sc-if value="{{ notEmpty }}" hint-placeholder-val="{{ false }}">
        <div class="sy-items">
          <sc-for list="{{ items }}" as="item" hint-placeholder-count="1">
            <div class="sy-item">
              <div>
                <p class="sy-item-name">{{ item.name }}</p>
                <p class="sy-item-detail">{{ item.detail }}</p>
              </div>
              <div class="sy-item-right">
                <span class="sy-item-total">{{ item.lineTotal }}</span>
                <button class="sy-remove" onClick="{{ item.remove }}">Remove</button>
              </div>
            </div>
          </sc-for>
        </div>
        <div class="sy-total-row">
          <p class="sy-total">Total: {{ total }}</p>
          <button class="pt-sqs-btn sy-checkout" onClick="{{ checkout }}">Checkout</button>
        </div>
        <a class="pt-sqs-btn pt-sqs-btn-sec" href="/store">Continue Shopping</a>
        <sc-if value="{{ error }}" hint-placeholder-val="{{ false }}">
          <p class="sy-error">{{ errorMsg }}</p>
        </sc-if>
      </sc-if>

    </div>
  </div>

</main>
<dc-import name="SiteFooter"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1425}}">
class Component extends DCLogic {
  state = { items: [], error: '' };
  componentDidMount() {
    this.setState({ items: window.PtCart.get() });
    window.addEventListener('pt-cart-changed', (e) => this.setState({ items: e.detail.items }));
  }
  renderVals() {
    const fmt = (c) => '$' + (c / 100).toFixed(2);
    const cents = (i) => (i.amount ? i.amount * 100 : i.priceCents) * (i.qty || 1);
    const items = this.state.items.map((i) => ({
      name: i.name,
      detail: (i.frequency && i.frequency !== 'one_time' ? i.frequency + ' · ' : '') + 'Qty ' + (i.qty || 1),
      lineTotal: fmt(cents(i)),
      remove: () => window.PtCart.remove(i.id),
    }));
    return {
      items,
      empty: items.length === 0,
      notEmpty: items.length > 0,
      total: fmt(this.state.items.reduce((s, i) => s + cents(i), 0)),
      error: !!this.state.error,
      errorMsg: this.state.error,
      checkout: async () => {
        try { await window.PtCart.checkout(); }
        catch (e) { this.setState({ error: e.message }); }
      },
    };
  }
}
</script>
</body>
</html>
