<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="any">
<script src="/support.js"></script>
<script src="/cart.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Paititi Institute</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2A1736">
<link rel="icon" href="/assets/brand/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="/_ds/meristem-design-system/tokens/fonts.css">
<link rel="stylesheet" href="/_ds/meristem-design-system/tokens/colors.css">
<link rel="stylesheet" href="/_ds/meristem-design-system/tokens/typography.css">
<link rel="stylesheet" href="/_ds/meristem-design-system/tokens/spacing.css">
<link rel="stylesheet" href="/_ds/meristem-design-system/tokens/effects.css">
<link rel="stylesheet" href="/_ds/meristem-design-system/styles.css">
<link rel="stylesheet" href="/paititi.css">
<link rel="stylesheet" href="/store.css">
<script src="/_ds/meristem-design-system/_ds_bundle.js"></script>
</helmet>
<div class="pt-page sy-shell">
<dc-import name="SiteHeader" active="store" hint-size="100%,209px"></dc-import>
<main>

  <!-- Squarespace's order confirmation lives behind its own checkout, so there
       is no live page to measure. It is built on the same system-page frame as
       the cart, which is the closest thing the original does show. -->
  <div class="sy-page">
    <div class="sy-body">

      <div class="sy-title-row"><h2 class="sy-title">Thank you</h2></div>
      <div class="sy-msg-row">
        <p class="sy-msg">Your payment was received and a receipt is on its way to your inbox. With deep gratitude from the whole Paititi family &mdash; your support helps preserve Indigenous wisdom, protect the Amazon, and awaken our shared human heart.</p>
      </div>
      <a class="pt-sqs-btn pt-sqs-btn-sec" href="/">Continue Shopping</a>

    </div>
  </div>

</main>
<dc-import name="SiteFooter"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
  componentDidMount() {
    if (window.PtCart) window.PtCart.clear();
  }
  renderVals() { return {}; }
}
</script>
</body>
</html>
