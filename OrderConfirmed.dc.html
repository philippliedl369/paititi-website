  <section style="background:var(--surface-page);min-height:45vh">
    <div style="max-width:var(--container-narrow);margin:0 auto;padding:96px 24px;text-align:center">
      <h1 style="font:var(--text-h1);color:var(--text-heading);margin:0 0 16px">Thank you! 🌿</h1>
      <p style="font-size:18px;line-height:1.7;margin:0 0 32px">Your payment was received. A receipt is on its way to your inbox. With deep gratitude from the whole Paititi family — your support helps preserve Indigenous wisdom, protect the Amazon, and awaken our shared human heart.</p>
      <a href="/" style="text-decoration:none"><x-import component-from-global-scope="MeristemDS.Button" variant="primary" size="lg" hint-size="180px,48px">Back to home</x-import></a>
    </div>
  </section>
</main>
<dc-import name="SiteFooter" hint-size="100%,700px"></dc-import>
</div>
</x-dc>

  componentDidMount() {
    if (window.PtCart) window.PtCart.clear();
  }
  renderVals() { return {}; }
}
