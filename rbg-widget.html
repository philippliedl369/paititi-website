<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Program listings</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/_ds/meristem-design-system/tokens/fonts.css">
<style>
  html,body{margin:0;background:transparent;font-family:'Lato',system-ui,sans-serif}
</style>
</head>
<body>
<!-- Retreat Guru "RBG Connect" widget, isolated from the DC runtime.
     Category comes from ?cat= (events,retreat | online-resources). -->
<div id="rbg-connect"></div>
<script type="text/javascript">
  var params = new URLSearchParams(location.search);
  var cat = params.get('cat') || 'events,retreat';
  // ?exclude= names the slugs of programs the parent page already presents as
  // hand-built sections: their cards are hidden so nothing is listed twice.
  // Matched against each card's HTML, which carries the slug in its links.
  var exclude = (params.get('exclude') || '').split(',').filter(Boolean);
  rbgOptions = { retreatType: "Retreat", customer: "paititi-institute", eventCategory: cat, buttonColor: "", defaultRoute: "" };
  !function(){function t(){var t=document.createElement("script");t.type="text/javascript",t.async=!0,t.src="https://s3.amazonaws.com/rbgconnect.retreat.guru/public/rbg-connect.min.js";var e=document.getElementsByTagName("script")[0];e.parentNode.insertBefore(t,e)}"complete"===document.readyState?t():window.attachEvent?window.attachEvent("onload",t):window.addEventListener("load",t,!1)}();
  // Hide excluded cards, then report height and the visible-card count so the
  // parent can grow the iframe — or collapse the whole band when nothing is
  // left to show. rbgCount stays null until the widget has rendered.
  setInterval(function () {
    var cards = document.querySelectorAll('.rs-event-wrapper');
    var visible = 0;
    for (var i = 0; i < cards.length; i++) {
      var c = cards[i];
      if (c.style.display !== 'none' && exclude.some(function (s) { return c.innerHTML.indexOf(s) !== -1; })) c.style.display = 'none';
      if (c.style.display !== 'none') visible++;
    }
    var rendered = !!document.querySelector('.rs-events-container');
    parent.postMessage({ rbgHeight: document.documentElement.scrollHeight, rbgCount: rendered ? visible : null, cat: cat }, location.origin);
  }, 500);
</script>
</body>
</html>
