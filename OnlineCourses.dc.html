<script>
  // Grow the Retreat Guru iframe with its content (see rbg-widget.html).
  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin || !e.data || !e.data.rbgHeight) return;
    var f = document.getElementById('rbg-frame');
    if (f) f.style.height = Math.max(1319, e.data.rbgHeight) + 'px';
  });
</script>
<style>
  .oc-hero{--pt-hero-h:932px;--pt-bg:#210416;--pt-scrim:rgba(33,4,22,.41);--pt-hero-ink:#fff}
  .oc-hero .pt-hero-panel{background:rgba(88,67,100,.32)}
  .oc-hero h1,.oc-hero p{text-align:center}
  .oc-list{--pt-bg:#F1EAF6}
  .oc-frame{width:100%;border:0;display:block}
</style>
</helmet>
<div class="pt-page">
<dc-import name="SiteHeader" active="courses" hint-size="100%,209px"></dc-import>
<main>

  <!-- ===== Hero ===== -->
  <section class="pt-sec pt-sec-flat pt-hero oc-hero">
    <div class="pt-sec-bg">
      <img src="/assets/retreats/online-courses-01.webp" alt="Morning light over the Paititi retreat centre" loading="eager">
    </div>
    <div class="pt-fluid" style="--pt-grid-top:304px;--pt-grid-bot:124px;--pt-rows:14">
      <div class="pt-hero-panel pt-prose" style="grid-area:1 / 5 / 10 / 21">
        <h1><strong>Online Courses</strong></h1>
        <p class="pt-lg">Our transformative courses at Paititi Institute invites you to embark on a journey that unites ancient wisdom with modern stewardship, fostering deep personal transformation and ecological awareness.</p>
      </div>
      <div class="pt-fit" style="grid-area:9 / 10 / 15 / 16">
        <img src="/assets/retreats/foundational-practices.webp" alt="" loading="lazy">
      </div>
    </div>
  </section>

  <!-- ===== Course listings (Retreat Guru) ===== -->
  <section class="pt-sec oc-list">
    <div class="pt-sec-bg"></div>
    <div class="pt-fluid" id="events" style="--pt-grid-top:95px;--pt-grid-bot:124px;--pt-rows:1;--pt-row-h:1318.6600px">
      <div style="grid-area:1 / 1 / 2 / 25">
        <iframe class="oc-frame" id="rbg-frame" src="/rbg-widget.html?cat=online-resources" title="Online course listings and registration" style="height:1319px" loading="lazy"></iframe>
      </div>
    </div>
  </section>

</main>
<dc-import name="SiteFooter"></dc-import>
</div>
