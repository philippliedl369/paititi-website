<style>
  .ct-hero{--pt-hero-h:674px;--pt-bg:#210416;--pt-scrim:rgba(33,4,22,.33);--pt-hero-ink:#fff}
  .ct-hero .pt-hero-panel{background:rgba(88,67,100,.53)}
  .ct-body{--pt-bg:#F1EAF6}

  /* "Get in touch" is an h1 on the original, not an h2, and sits at 41.6px. */
  .ct-body h1{font-size:41.6px;line-height:1.3104}

  /* Squarespace's form fields: white fill, pill radius, no border at all. The
     field label is 17.6px, its "(required)" a smaller grey; the two name
     fields sit under one shared "Name" heading with 12px sub-labels. */
  .ct-form{display:grid;gap:24px}
  .ct-group{display:grid;gap:6px}
  .ct-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .ct-field label,.ct-legend{display:block;font-size:17.6px;font-weight:300;line-height:1.4;color:#210416;margin-bottom:8px}
  .ct-row .ct-field label{font-size:12px;letter-spacing:.02em;margin-bottom:6px}
  .ct-req{color:rgba(33,4,22,.5);font-size:.82em;letter-spacing:.02em}
  .ct-field input,.ct-field textarea{width:100%;padding:12px 20px;height:50px;
    border:0;border-radius:30.9088px;background:#fff;
    font-family:var(--font-body);font-size:17.6px;font-weight:300;letter-spacing:.08em;color:#210416}
  .ct-field textarea{height:80px;resize:vertical;border-radius:30.9088px}
  .ct-field input:focus,.ct-field textarea:focus{outline:2px solid #584364;outline-offset:2px}

  /* Squarespace draws the opt-in box as a hollow circle, not a tick box. */
  .ct-check{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:300;color:#210416}
  .ct-check input{appearance:none;-webkit-appearance:none;flex:0 0 auto;width:19px;height:19px;
    margin:0;border:1px solid rgba(33,4,22,.55);border-radius:50%;background:#fff;cursor:pointer}
  .ct-check input:checked{background:#584364;box-shadow:inset 0 0 0 3px #fff}
  .ct-check input:focus-visible{outline:2px solid #584364;outline-offset:2px}
  .ct-check label{cursor:pointer}

  /* .pt-fluid stretches buttons to their cell; this one sizes to its label. */
  .ct-form .ct-submit{width:140px;height:auto}

  /* The photo is clipped to an arched top. It has to be an inline clipPath —
     a data-URI SVG in CSS reaches the DOM with its viewBox mangled. */
  .ct-arch>img{clip-path:url(#ct-arch);object-position:15% center}

  @media (max-width:1180px){
    .ct-row{grid-template-columns:1fr}
  }
</style>

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1700}}">
class Component extends DCLogic {
  state = { sent: false, error: '' };
  renderVals() {
    return {
      sent: this.state.sent,
      notSent: !this.state.sent,
      error: !!this.state.error,
      errorMsg: this.state.error,
      submit: async (e) => {
        e.preventDefault();
        const f = e.target;
        try {
          const res = await fetch('/api/contact', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              name: `${f.firstName.value} ${f.lastName.value}`.trim(),
              email: f.email.value,
              message: f.message.value,
              website: f.website.value,
            }),
          });
          if (res.ok) {
            // The opt-in rides along with the message but does not gate it: a
            // newsletter provider that is down must not lose the enquiry.
            if (f.subscribe.checked) {
              fetch('/api/newsletter', {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ email: f.email.value, source: 'contact', website: f.website.value }),
              }).catch(() => {});
            }
            this.setState({ sent: true, error: '' });
          }
          else {
            const data = await res.json().catch(() => ({}));
            this.setState({ error: data.error || 'Could not send message, please email us directly.' });
          }
        } catch (err) {
          this.setState({ error: 'Could not send message, please email us directly.' });
        }
      },
    };
  }
}
</script>
