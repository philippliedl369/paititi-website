<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="any">
<script src="/support.js"></script>
<script src="/cart.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Store 2 | Paititi Institute</title>
<meta property="og:title" content="Store 2 | Paititi Institute">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Paititi Institute">
<meta property="og:image" content="/assets/store/9f81c-coca-ceremony-paititi-institute-iquitos-peru-greg-good.webp">
<meta name="theme-color" content="#2A1736">
<link rel="icon" href="/assets/brand/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="/_ds/meristem-design-system/tokens/fonts.css">
<link rel="stylesheet" href="/_ds/meristem-design-system/tokens/colors.css">
<link rel="stylesheet" href="/_ds/meristem-design-system/tokens/typography.css">
<link rel="stylesheet" href="/_ds/meristem-design-system/tokens/spacing.css">
<link rel="stylesheet" href="/_ds/meristem-design-system/tokens/effects.css">
<link rel="stylesheet" href="/_ds/meristem-design-system/styles.css">
<link rel="stylesheet" href="/paititi.css">
<link rel="stylesheet" href="/store.css">
<script src="/_ds/meristem-design-system/_ds_bundle.js"></script>
</helmet>
<div class="pt-page">
<dc-import name="SiteHeader" active="store" hint-size="100%,209px"></dc-import>
<main>

  <!-- A commerce page, not a fluid-engine one: no grid, no wave divider, white
       throughout, and the header's height is reserved as section padding. -->
  <section class="st-sec">
    <div class="st-list">

      <div class="st-header"><h2>Store</h2></div>

      <!-- Row 2 of the product-list grid. On a category page it collapses to
           zero height, which is what moves the product grid 52px up there. -->
      <div class="st-nav">
        <ul>
          <li><a href="/store/retreats">US TOUR</a></li>
        </ul>
      </div>

      <!-- Rows 3 and 5 are the filter drawer and the pager. Both are empty on
           this store but they still carry a 10px gap each, so they stay. -->
      <div></div>

      <!-- The store carries a single product. Cards are written out rather than
           looped so the image src is a real URL in the source: a bound src is
           fetched literally by the parser before the runtime rewrites it. -->
      <div class="st-container">
        <div class="st-grid">
          <div class="st-item">
            <a class="st-link" href="/store/p/us-tour-rsvp-donation">
              <div class="st-img">
                <img src="/assets/store/9f81c-coca-ceremony-paititi-institute-iquitos-peru-greg-good.webp"
                     alt="US TOUR RSVP DONATION" loading="eager">
              </div>
              <section class="st-meta">
                <div class="st-title-price">
                  <div class="st-title">US TOUR RSVP DONATION</div>
                  <div class="st-price">$300.00</div>
                </div>
              </section>
            </a>
            <div class="st-cart">
              <button class="pt-sqs-btn" onClick="{{ add }}">{{ cta }}</button>
            </div>
          </div>
        </div>
      </div>

      <div></div>

    </div>
  </section>

</main>
<dc-import name="SiteFooter"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1926}}">
class Component extends DCLogic {
  state = { added: false };
  renderVals() {
    const product = { id: 'us-tour-rsvp-donation', name: 'US TOUR RSVP DONATION', priceCents: 30000 };
    return {
      cta: this.state.added ? 'Added!' : 'RSVP',
      add: (e) => {
        e.preventDefault();
        window.PtCart.add(product);
        this.setState({ added: true });
      },
    };
  }
}
</script>
</body>
</html>
